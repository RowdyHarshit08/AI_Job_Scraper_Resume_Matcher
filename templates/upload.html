{% extends "base.html" %}{% block title %}Upload Resume · AI Job Matcher{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card p-4 p-md-5">
<h2 class="fw-bold">Upload your resume</h2><p class="text-muted">PDF or DOCX · Maximum 5 MB</p>
<form method="post" enctype="multipart/form-data">
<div class="upload-box mb-3"><input class="form-control form-control-lg" type="file" name="resume" accept=".pdf,.docx" required></div>
<button class="btn btn-primary btn-lg w-100">Analyze Resume</button>
</form>
<div class="small text-muted mt-3">Tip: use a text-based PDF. Scanned/image-only PDFs may not contain extractable text.</div>
</div></div></div>
{% endblock %}
