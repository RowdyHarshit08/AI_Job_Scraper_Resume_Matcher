<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AI Job Scraper & Resume Matcher{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head><body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand fw-bold" href="{{ url_for('index') }}">AI Job Matcher</a>
<div><a class="btn btn-sm btn-outline-primary" href="{{ url_for('upload') }}">Upload Resume</a></div>
</div></nav>
<main class="container py-4">
{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}
<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4">AI Job Scraper & Resume Matcher · Demo/educational project</footer>
</body></html>
